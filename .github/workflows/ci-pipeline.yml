name: CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
        # Baixa o código do repositório
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
      # Configura a versão do Node.js para o ambiente de execução
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # Configura o Docker Buildx para permitir a construção de imagens Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: docker build -t my-app:latest .